<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産リバランスツール</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        main {
            padding: 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
        }

        .section h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin-right: 12px;
        }

        .asset-class {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            align-items: center;
        }

        .asset-class label {
            color: #555;
            font-weight: 600;
            grid-column: 1;
        }

        .asset-class input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .asset-class .current-amount,
        .asset-class .current-percentage {
            color: #667eea;
            font-weight: 600;
            text-align: right;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .totals {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .total-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-item label {
            color: #555;
            font-weight: 600;
        }

        .total-item .value {
            font-size: 1.3em;
            font-weight: 700;
            color: #667eea;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 1200px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-wrapper {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .chart-wrapper h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        canvas {
            max-height: 400px;
        }

        .recommendations {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #764ba2;
            margin-top: 30px;
        }

        .recommendations h2 {
            margin-bottom: 20px;
        }

        .recommendation-item {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recommendation-item.buy {
            border-left-color: #28a745;
        }

        .recommendation-item.sell {
            border-left-color: #dc3545;
        }

        .rec-content {
            flex: 1;
        }

        .rec-asset {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .rec-details {
            font-size: 0.9em;
            color: #666;
        }

        .rec-amount {
            font-size: 1.2em;
            font-weight: 700;
            text-align: right;
            margin-left: 20px;
        }

        .rec-amount.buy {
            color: #28a745;
        }

        .rec-amount.sell {
            color: #dc3545;
        }

        .deviation-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .deviation-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        .no-recommendations {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 1.1em;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #1565c0;
        }

        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #c62828;
        }

        .success-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #2e7d32;
        }

        .csv-import {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .csv-import p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 12px;
        }

        .csv-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .csv-controls input[type="file"] {
            flex: 2;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fff;
        }

        .csv-controls button {
            flex: 1;
        }

        .csv-import-result ul {
            margin-top: 10px;
            padding-left: 20px;
        }

        .csv-import-result li {
            margin-bottom: 6px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .asset-class {
                grid-template-columns: 1fr;
            }

            .button-group,
            .csv-controls {
                flex-direction: column;
            }

            .csv-controls input[type="file"],
            .csv-controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 資産リバランスツール</h1>
            <p>現在の資産配分を目標に近づけるための提案をします</p>
        </header>

        <main>
            <div class="layout">
                <!-- 左側: 現在の資産入力 -->
                <div class="section">
                    <h2>現在の資産配分</h2>
                    

                    <div class="csv-import">
                        <p>証券会社・取引所のCSVから現在の資産配分を取り込みます。対応列名を自動探索し、分類できない行は警告に表示します。</p>
                        <div class="csv-controls">
                            <input type="file" id="csv-file" accept=".csv,text/csv">
                            <button class="btn-secondary" onclick="handleCsvUpload()">CSV取込</button>
                        </div>
                        <div id="csv-import-result" class="csv-import-result" style="display: none;"></div>
                    </div>

                    <div class="asset-class">
                        <label>全世界株インデックスファンド</label>
                        <input type="number" id="current-global-index" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-global-index-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>日経平均インデックスファンド</label>
                        <input type="number" id="current-nikkei-index" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-nikkei-index-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>日本株</label>
                        <input type="number" id="current-jp-stocks" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-jp-stocks-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>米国株</label>
                        <input type="number" id="current-us-stocks" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-us-stocks-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>ビットコイン</label>
                        <input type="number" id="current-bitcoin" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-bitcoin-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>イーサリアム</label>
                        <input type="number" id="current-ethereum" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-ethereum-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>ソラナ</label>
                        <input type="number" id="current-solana" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-solana-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>現金</label>
                        <input type="number" id="current-cash" placeholder="金額を入力" min="0" step="1000">
                        <span class="current-amount" id="current-cash-display">¥0</span>
                    </div>

                    <div class="totals">
                        <div class="total-item">
                            <label>総資産:</label>
                            <span class="value" id="total-current">¥0</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn-secondary" onclick="clearCurrent()">クリア</button>
                    </div>
                </div>

                <!-- 右側: 目標配分設定 -->
                <div class="section">
                    <h2>目標資産配分</h2>

                    <div class="asset-class">
                        <label>全世界株インデックスファンド</label>
                        <input type="number" id="target-global-index" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>日経平均インデックスファンド</label>
                        <input type="number" id="target-nikkei-index" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>日本株</label>
                        <input type="number" id="target-jp-stocks" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>米国株</label>
                        <input type="number" id="target-us-stocks" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>ビットコイン</label>
                        <input type="number" id="target-bitcoin" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>イーサリアム</label>
                        <input type="number" id="target-ethereum" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>ソラナ</label>
                        <input type="number" id="target-solana" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="asset-class">
                        <label>現金</label>
                        <input type="number" id="target-cash" min="0" max="100" step="1">
                        <span class="current-percentage">%</span>
                    </div>

                    <div class="totals">
                        <div class="total-item">
                            <label>合計:</label>
                            <span class="value" id="total-target">0%</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn-primary" onclick="calculateRebalance()">リバランス提案を計算</button>
                    </div>

                    <div id="target-validation" class="info-box" style="display: none;"></div>

                    <h2 style="margin-top: 30px; margin-bottom: 20px;">投資信託の基準価額</h2>

                    <div class="asset-class">
                        <label>全世界株インデックスファンド</label>
                        <input type="number" id="price-global-index" placeholder="価格を入力" min="0" step="1">
                        <span class="current-amount" id="price-global-index-display">¥0</span>
                    </div>

                    <div class="asset-class">
                        <label>日経平均インデックスファンド</label>
                        <input type="number" id="price-nikkei-index" placeholder="価格を入力" min="0" step="1">
                        <span class="current-amount" id="price-nikkei-index-display">¥0</span>
                    </div>
                </div>
            </div>

            <!-- チャート -->
            <div class="charts-container" id="charts-container" style="display: none;">
                <div class="chart-wrapper">
                    <h3>📊 現在の配分</h3>
                    <canvas id="current-chart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <h3>🎯 目標配分</h3>
                    <canvas id="target-chart"></canvas>
                </div>
            </div>

            <!-- リバランス提案 -->
            <div class="recommendations" id="recommendations-section" style="display: none;">
                <h2>🔄 リバランス提案</h2>
                <div id="recommendations-content"></div>
            </div>
        </main>
    </div>

    <script>
        const ASSET_CLASSES = [
            { id: 'global-index', label: '全世界株インデックスファンド' },
            { id: 'nikkei-index', label: '日経平均インデックスファンド' },
            { id: 'jp-stocks', label: '日本株' },
            { id: 'us-stocks', label: '米国株' },
            { id: 'bitcoin', label: 'ビットコイン' },
            { id: 'ethereum', label: 'イーサリアム' },
            { id: 'solana', label: 'ソラナ' },
            { id: 'cash', label: '現金' }
        ];

        const COLORS = [
            '#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140'
        ];

        const CSV_COLUMN_CANDIDATES = {
            assetName: ['銘柄', '銘柄名', '商品名', '通貨', 'Symbol', 'Asset'],
            amount: ['評価額', '時価評価額', '評価金額', '円換算額', '残高', 'Amount', 'Value']
        };
        const PRESETS = {
            balanced: { 'global-index': 30, 'nikkei-index': 15, 'jp-stocks': 10, 'us-stocks': 20, 'bitcoin': 10, 'ethereum': 8, 'solana': 2, 'cash': 5 },
            growth: { 'global-index': 25, 'nikkei-index': 10, 'jp-stocks': 8, 'us-stocks': 25, 'bitcoin': 15, 'ethereum': 12, 'solana': 5, 'cash': 0 },
            conservative: { 'global-index': 35, 'nikkei-index': 20, 'jp-stocks': 15, 'us-stocks': 15, 'bitcoin': 3, 'ethereum': 2, 'solana': 0, 'cash': 10 }
        };

        let currentChart = null;
        let targetChart = null;

        // 自動計算のための入力リスナー
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', updateDisplay);
            input.addEventListener('change', validateTargets);
        });

        function getCurrencyFormat(value) {
            return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(value);
        }

        function updateDisplay() {
            // 現在の資産表示更新
            let total = 0;
            ASSET_CLASSES.forEach(asset => {
                const input = document.getElementById(`current-${asset.id}`);
                const value = parseFloat(input.value) || 0;
                total += value;
                const displayEl = document.getElementById(`current-${asset.id}-display`);
                if (displayEl) displayEl.textContent = getCurrencyFormat(value);
            });

            document.getElementById('total-current').textContent = getCurrencyFormat(total);

            // 目標配分の合計計算
            let targetTotal = 0;
            ASSET_CLASSES.forEach(asset => {
                const input = document.getElementById(`target-${asset.id}`);
                const value = parseFloat(input.value) || 0;
                targetTotal += value;
            });
            document.getElementById('total-target').textContent = targetTotal.toFixed(1) + '%';

            // 1口あたりの価格表示更新
            ASSET_CLASSES.forEach(asset => {
                const input = document.getElementById(`price-${asset.id}`);
                if (input) {
                    const value = parseFloat(input.value) || 0;
                    const displayEl = document.getElementById(`price-${asset.id}-display`);
                    if (displayEl) displayEl.textContent = getCurrencyFormat(value);
                }
            });

            validateTargets();
        }

        function validateTargets() {
            const validationEl = document.getElementById('target-validation');
            let total = 0;
            ASSET_CLASSES.forEach(asset => {
                const input = document.getElementById(`target-${asset.id}`);
                const value = parseFloat(input.value) || 0;
                total += value;
            });

            if (Math.abs(total - 100) < 0.01) {
                validationEl.style.display = 'none';
            } else if (Math.abs(total - 100) < 1) {
                validationEl.style.display = 'block';
                validationEl.className = 'info-box';
                validationEl.textContent = `⚠️ 目標配分の合計が ${total.toFixed(1)}% です (100% に調整してください)`;
            } else {
                validationEl.style.display = 'block';
                validationEl.className = 'error-box';
                validationEl.textContent = `❌ 目標配分の合計が ${total.toFixed(1)}% です (100% になるようにしてください)`;
            }
        }

        function loadPreset(presetName) {
            const preset = PRESETS[presetName];
            ASSET_CLASSES.forEach(asset => {
                document.getElementById(`target-${asset.id}`).value = preset[asset.id];
            });
            updateDisplay();
        }

        function clearCurrent() {
            ASSET_CLASSES.forEach(asset => {
                document.getElementById(`current-${asset.id}`).value = '';
            });
            updateDisplay();
        }

        function handleCsvUpload() {
            const fileInput = document.getElementById('csv-file');
            const file = fileInput.files[0];

            if (!file) {
                showCsvImportMessage('CSVファイルを選択してください。', 'error-box');
                return;
            }

            const reader = new FileReader();
            reader.onload = event => {
                try {
                    importCsvAllocations(event.target.result);
                } catch (error) {
                    showCsvImportMessage(`CSVの取り込みに失敗しました: ${error.message}`, 'error-box');
                }
            };
            reader.onerror = () => {
                showCsvImportMessage('CSVファイルを読み込めませんでした。ファイルを確認してください。', 'error-box');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function importCsvAllocations(csvText) {
            const rows = parseCsv(csvText);
            if (rows.length < 2) {
                throw new Error('ヘッダー行とデータ行が必要です。');
            }

            const headers = rows[0].map(header => header.trim());
            const assetColumnIndex = findColumnIndex(headers, CSV_COLUMN_CANDIDATES.assetName);
            const amountColumnIndex = findColumnIndex(headers, CSV_COLUMN_CANDIDATES.amount);

            if (assetColumnIndex === -1 || amountColumnIndex === -1) {
                const missingColumns = [];
                if (assetColumnIndex === -1) missingColumns.push('銘柄名・商品名・通貨名');
                if (amountColumnIndex === -1) missingColumns.push('評価額・時価評価額・残高');
                throw new Error(`${missingColumns.join('、')}の列が見つかりません。対応列名を確認してください。`);
            }

            const totalsByAsset = Object.fromEntries(ASSET_CLASSES.map(asset => [asset.id, 0]));
            const unclassifiedRows = [];
            let importedRows = 0;

            rows.slice(1).forEach((row, index) => {
                if (row.every(cell => cell.trim() === '')) return;

                const assetName = (row[assetColumnIndex] || '').trim();
                const amountText = row[amountColumnIndex] || '';
                const amount = parseAmount(amountText);
                const assetClassId = classifyAssetName(assetName);
                const rowNumber = index + 2;

                if (!assetName || !Number.isFinite(amount) || !assetClassId) {
                    unclassifiedRows.push({
                        rowNumber,
                        assetName: assetName || '(空欄)',
                        amountText: amountText || '(空欄)',
                        reason: !assetName ? '銘柄名が空欄' : (!Number.isFinite(amount) ? '評価額を数値化できない' : '分類ルールに一致しない')
                    });
                    return;
                }

                totalsByAsset[assetClassId] += amount;
                importedRows += 1;
            });

            ASSET_CLASSES.forEach(asset => {
                document.getElementById(`current-${asset.id}`).value = totalsByAsset[asset.id] || '';
            });

            updateDisplay();
            showCsvImportResult(importedRows, totalsByAsset, unclassifiedRows);
        }

        function parseCsv(csvText) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        cell += '"';
                        i += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell);
                    cell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    row.push(cell);
                    rows.push(row);
                    row = [];
                    cell = '';
                    if (char === '\r' && nextChar === '\n') i += 1;
                } else {
                    cell += char;
                }
            }

            if (cell !== '' || row.length > 0) {
                row.push(cell);
                rows.push(row);
            }

            return rows.filter((parsedRow, index) => index === 0 || parsedRow.some(cellValue => cellValue.trim() !== ''));
        }

        function findColumnIndex(headers, candidates) {
            const normalizedCandidates = candidates.map(normalizeColumnName);
            return headers
                .map(normalizeColumnName)
                .findIndex(header => normalizedCandidates.includes(header));
        }

        function normalizeColumnName(value) {
            return String(value || '').trim().toLowerCase();
        }

        function parseAmount(value) {
            const normalized = String(value || '')
                .trim()
                .replace(/[￥¥円,，\s]/g, '')
                .replace(/^\((.*)\)$/, '-$1');
            const amount = Number(normalized);
            return Number.isFinite(amount) ? amount : NaN;
        }

        function classifyAssetName(assetName) {
            const normalized = String(assetName || '').trim();
            const upper = normalized.toUpperCase();

            if (/オルカン|全世界|ACWI/i.test(normalized)) return 'global-index';
            if (/日経|NIKKEI|225/i.test(normalized)) return 'nikkei-index';
            if (/日本株|国内株/i.test(normalized)) return 'jp-stocks';
            if (/米国株|S&P\s*500|S＆P\s*500|NASDAQ/i.test(normalized) || /(^|[^A-Z])US([^A-Z]|$)/i.test(upper)) return 'us-stocks';
            if (/BTC|BITCOIN|ビットコイン/i.test(normalized)) return 'bitcoin';
            if (/ETH|ETHEREUM|イーサリアム/i.test(normalized)) return 'ethereum';
            if (/SOL|SOLANA|ソラナ/i.test(normalized)) return 'solana';
            if (/現金|JPY|日本円/i.test(normalized)) return 'cash';
            return null;
        }

        function showCsvImportResult(importedRows, totalsByAsset, unclassifiedRows) {
            const importedAssets = ASSET_CLASSES
                .filter(asset => totalsByAsset[asset.id] !== 0)
                .map(asset => `${asset.label}: ${getCurrencyFormat(totalsByAsset[asset.id])}`);

            let html = `<strong>CSV取込完了:</strong> ${importedRows}行を取り込みました。`;
            if (importedAssets.length > 0) {
                html += `<ul>${importedAssets.map(text => `<li>${escapeHtml(text)}</li>`).join('')}</ul>`;
            }

            if (unclassifiedRows.length > 0) {
                html += `<p style="margin-top: 10px;"><strong>⚠️ 未分類行:</strong> ${unclassifiedRows.length}行あります。該当する資産クラスへ手入力で補正してください。</p>`;
                html += `<ul>${unclassifiedRows.map(row => `<li>${row.rowNumber}行目: ${escapeHtml(row.assetName)} / ${escapeHtml(row.amountText)}（${escapeHtml(row.reason)}）</li>`).join('')}</ul>`;
                showCsvImportMessage(html, 'error-box', true);
            } else {
                showCsvImportMessage(html, 'success-box', true);
            }
        }

        function showCsvImportMessage(message, className, isHtml = false) {
            const resultEl = document.getElementById('csv-import-result');
            resultEl.style.display = 'block';
            resultEl.className = `csv-import-result ${className}`;
            if (isHtml) {
                resultEl.innerHTML = message;
            } else {
                resultEl.textContent = message;
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function calculateRebalance() {
            // 総資産の計算
            let totalAssets = 0;
            const currentAllocations = {};
            
            ASSET_CLASSES.forEach(asset => {
                const value = parseFloat(document.getElementById(`current-${asset.id}`).value) || 0;
                currentAllocations[asset.id] = value;
                totalAssets += value;
            });

            // 目標配分の検証
            let targetTotal = 0;
            ASSET_CLASSES.forEach(asset => {
                const value = parseFloat(document.getElementById(`target-${asset.id}`).value) || 0;
                targetTotal += value;
            });

            if (Math.abs(targetTotal - 100) > 0.1) {
                alert('目標配分の合計が100%ではありません。調整してください。');
                return;
            }

            if (totalAssets <= 0) {
                alert('総資産が0です。資産を入力してください。');
                return;
            }

            // 現在の配分率計算
            const currentPercentages = {};
            ASSET_CLASSES.forEach(asset => {
                currentPercentages[asset.id] = (currentAllocations[asset.id] / totalAssets) * 100;
            });

            // 目標配分取得
            const targetPercentages = {};
            ASSET_CLASSES.forEach(asset => {
                targetPercentages[asset.id] = parseFloat(document.getElementById(`target-${asset.id}`).value) || 0;
            });

            // リバランス提案生成
            const recommendations = [];
            ASSET_CLASSES.forEach(asset => {
                const current = currentAllocations[asset.id];
                const currentPct = currentPercentages[asset.id];
                const targetPct = targetPercentages[asset.id];
                const targetAmount = (targetPct / 100) * totalAssets;
                const difference = targetAmount - current;

                const priceInput = document.getElementById(`price-${asset.id}`);
                const price = priceInput ? parseFloat(priceInput.value) || 0 : 0;
                const units = price > 0 ? (Math.abs(difference) * 10000) / price : 0;

                recommendations.push({
                    assetId: asset.id,
                    label: asset.label,
                    current: current,
                    currentPct: currentPct,
                    target: targetAmount,
                    targetPct: targetPct,
                    difference: difference,
                    diffPct: targetPct - currentPct,
                    price: price,
                    units: units
                });
            });

            // チャート描画
            drawCharts(currentPercentages, targetPercentages);

            // リバランス提案表示
            displayRecommendations(recommendations);
        }

        function drawCharts(currentPercentages, targetPercentages) {
            const labels = ASSET_CLASSES.map(a => a.label);
            const currentData = ASSET_CLASSES.map(a => currentPercentages[a.id]);
            const targetData = ASSET_CLASSES.map(a => targetPercentages[a.id]);

            const chartOptions = {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed.y.toFixed(1) + '%';
                            }
                        }
                    }
                }
            };

            // 現在の配分チャート
            const currentCtx = document.getElementById('current-chart');
            if (currentChart) currentChart.destroy();
            currentChart = new Chart(currentCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: currentData,
                        backgroundColor: COLORS,
                        borderColor: 'white',
                        borderWidth: 2
                    }]
                },
                options: chartOptions
            });

            // 目標配分チャート
            const targetCtx = document.getElementById('target-chart');
            if (targetChart) targetChart.destroy();
            targetChart = new Chart(targetCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: targetData,
                        backgroundColor: COLORS,
                        borderColor: 'white',
                        borderWidth: 2
                    }]
                },
                options: chartOptions
            });

            document.getElementById('charts-container').style.display = 'grid';
        }

        function displayRecommendations(recommendations) {
            const container = document.getElementById('recommendations-content');
            const section = document.getElementById('recommendations-section');

            let html = '';
            let hasRecommendations = false;

            recommendations.forEach(rec => {
                if (Math.abs(rec.difference) > 100) { // 100円以上の差異がある場合のみ表示
                    hasRecommendations = true;
                    const isBuy = rec.difference > 0;
                    const action = isBuy ? '買増し' : '売却';
                    const actionClass = isBuy ? 'buy' : 'sell';
                    const sign = isBuy ? '+' : '';

                    const deviationPct = Math.abs(rec.diffPct);
                    const deviationBar = (deviationPct / 50) * 100; // 最大50%の差異を想定

                    let unitsInfo = '';
                    if (rec.price > 0) {
                        const actionText = isBuy ? '購入' : '売却';
                        unitsInfo = `<br><span style="font-size: 0.85em; color: #666;">（${Math.round(rec.units)}口${actionText}）</span>`;
                    }

                    html += `
                        <div class="recommendation-item ${actionClass}">
                            <div class="rec-content">
                                <div class="rec-asset">${rec.label}</div>
                                <div class="rec-details">
                                    現在: ${rec.currentPct.toFixed(1)}% (${getCurrencyFormat(rec.current)}) 
                                    → 目標: ${rec.targetPct.toFixed(1)}% (${getCurrencyFormat(rec.target)})
                                </div>
                                <div class="deviation-bar">
                                    <div class="deviation-fill" style="width: ${Math.min(deviationBar, 100)}%"></div>
                                </div>
                            </div>
                            <div class="rec-amount ${actionClass}">
                                ${getCurrencyFormat(Math.abs(rec.difference))}
                                ${unitsInfo}
                                <span style="font-size: 0.8em; display: block; margin-top: 5px;">(${isBuy ? '+' : '-'}${Math.abs(rec.diffPct).toFixed(1)}ポイント)</span>
                            </div>
                        </div>
                    `;
                }
            });

            if (!hasRecommendations) {
                html = '<div class="no-recommendations">✨ リバランスは不要です。現在の配分が目標に近い状態です。</div>';
            }

            container.innerHTML = html;
            section.style.display = 'block';
        }

        // 初期表示
        updateDisplay();
    </script>
</body>
</html>
